name: Browser checks
on:
  pull_request:
  push:
    branches: [ codex/initial-build ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    uses: ./.github/workflows/source-security.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency security and Worker tests
        run: |
          node scripts/audit-policy.mjs --omit=dev
          node scripts/audit-policy.mjs
          npm run release:checks
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run release:prepare
      - run: npm run test:browser
      - name: Save browser report and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Save the exact build that passed Chromium
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-site-build
          path: dist/
          include-hidden-files: true
          retention-days: 1
  deploy:
    needs: [ browser, source ]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/initial-build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    concurrency:
      group: site-deploy-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-site-build
          path: dist/
      - run: npm run release:prepare
      - name: Confirm the checked commit is still current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-release-head.mjs
      - name: Deploy only the checked build with the site-only token
        id: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d29f48cc069d51d0787fc306533039e1
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/deploy-verified.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed preview with Chromium
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.release.outputs.url }}
        run: npm run test:browser
      - name: Verify production with Chromium without submitting enquiries
        if: github.event_name != 'pull_request'
        env:
          PREVIEW_URL: https://www.cumbuco.net.br
        run: npm run test:browser
      - name: Save live verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-browser-report
          path: |
            playwright-report/
            test-results/
            deployment-result.json
          retention-days: 7
